    function showTag(tag, description) {
      document.querySelectorAll('.tag-list button').forEach(btn => btn.classList.remove('selected'));
      event.target.classList.add('selected');
      
      const examples = tagExamples[tag] || {};
      
      const detailBox = document.createElement('div');
      detailBox.className = 'tag-details-box';
      detailBox.innerHTML = `
        <h3><span class='tag-highlight'>${tag}</span> 태그 활용 가이드</h3>
        <div class='detail-section'><strong>의미:</strong> ${description}</div>
        
        <div class='example-section'>
          <div class='example-title'>💡 기본 사용법</div>
          <code>${examples.basic || tag + ' 기본 예시'}</code>
        </div>
        
        <div class='example-section'>
          <div class='example-title'>🎭 다른 감정과 조합</div>
          <code>${examples.combination || tag + '와 다른 태그 조합 예시'}</code>
        </div>
        
        <div class='example-section'>
          <div class='example-title'>⏰ 타이밍 태그와 함께</div>
          <code>${examples.timing || tag + '와 타이밍 태그 조합'}</code>
        </div>
        
        <div class='example-section'>
          <div class='example-title'>😄 재미있는 상황</div>
          <code>${examples.funny || tag + ' 유머러스한 활용'}</code>
        </div>
        
        <div class='example-section'>
          <div class='example-title'>👤 캐릭터별 활용</div>
          <code>${examples.character || tag + ' 캐릭터 특성 반영'}</code>
        </div>
        
        <div class='example-section'>
          <div class='example-title'>🎬 실제 상황 예시</div>
          <code>${examples.situation || tag + ' 실생활 적용'}</code>
        </div>
        
        <div class='detail-section'><strong>💡 활용 팁:</strong> 
        • 태그는 문장의 앞, 중간, 또는 끝에 자연스럽게 배치하세요<br>
        • [pause] 태그와 함께 사용하면 더욱 자연스러운 연출이 가능합니다<br>
        • 같은 감정 계열의 태그들을 조합하면 더 강한 표현이 됩니다<br>
        • 상반된 감정 태그를 순서대로 사용하면 감정 변화를 자연스럽게 표현할 수 있습니다
        </div>
      `;
      const container = document.getElementById('tagDetails');
      container.innerHTML = '';
      container.appendChild(detailBox);
    }

    function toggleSection(id) {
      // Close all other sections
      document.querySelectorAll('.category-section').forEach(section => {
        if (section.id !== id) section.style.display = "none";
      });
      // Remove active class from all toggles
      document.querySelectorAll('.category-toggle').forEach(btn => btn.classList.remove('active'));
      // Toggle selected section
      var section = document.getElementById(id);
      var toggleBtn = document.querySelector(`[onclick*="${id}"]`);
      if (section.style.display === "none" || section.style.display === "") {
        section.style.display = "block";
        toggleBtn.classList.add('active');
      } else {
        section.style.display = "none";
        toggleBtn.classList.remove('active');
      }
    }
